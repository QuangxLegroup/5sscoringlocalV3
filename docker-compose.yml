services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5175
      DATA_DIR: /app/data
      DATA_FILE: ${DATA_FILE:-runtime/main-data.json}
      PHOTO_DIR: /app/data/photos
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      DATABASE_URL: ${DATABASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LeGroup 5S}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-20000}
    ports:
      - "${BACKEND_PORT:-5175}:5175"
    volumes:
      - ./data:/app/data
      - ./server.js:/app/server.js
      - ./src:/app/src
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5175/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./styles.css:/usr/share/nginx/html/styles.css
      - ./app.js:/usr/share/nginx/html/app.js
      - ./standards.js:/usr/share/nginx/html/standards.js
      - ./manifest.json:/usr/share/nginx/html/manifest.json
      - ./service-worker.js:/usr/share/nginx/html/service-worker.js
      - ./modules:/usr/share/nginx/html/modules
      - ./images:/usr/share/nginx/html/images
    restart: unless-stopped
